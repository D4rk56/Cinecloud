services:
  # Service Cloudflare WARP : contourne les blocages d'IP Datacenter sur VPS
  warp:
    image: caomingjun/warp:latest
    container_name: cinecloud-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    # Les sysctls suivants sont optionnels en mode proxy et bloqués sur certains hôtes VPS/LXC :
    # sysctls:
    #   - net.ipv6.conf.all.disable_ipv6=0
    #   - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - WARP_SLEEP=2
    volumes:
      - cinecloud-warp:/var/lib/cloudflare-warp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -x http://127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      default:
        aliases:
          - warp
          - cinecloud-warp
          - nuvio-warp

  cinecloud:
    image: ghcr.io/d4rk56/cinecloud:latest
    build: .
    container_name: cinecloud
    restart: unless-stopped
    init: true
    ports:
      # Liaison sur localhost uniquement : le reverse proxy (Nginx, Caddy, etc.)
      # redirige les requêtes publiques vers ce port local sécurisé.
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WARP_PROXY=http://warp:1080
      # Clé secrète de chiffrement AES-256-GCM (auto-générée si omise)
      # - APP_SECRET=changez_ce_secret_pour_la_production
      # Synchronisation RSS d'arrière-plan Prowlarr (optionnel)
      # - PROWLARR_URL=http://prowlarr:9696
      # - PROWLARR_KEY=votre_cle_api_prowlarr
    depends_on:
      warp:
        condition: service_healthy
    extra_hosts:
      # Permet de joindre Prowlarr sur la machine hôte via http://host.docker.internal:9696
      - "host.docker.internal:host-gateway"
    volumes:
      - cinecloud-data:/app/data
    networks:
      default:
        aliases:
          - cinecloud
          - nuvio

    # Exemple pour intégration à un réseau partagé (Traefik, NPM, etc.) :
    # networks:
    #   - proxy_network
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.cinecloud.rule=Host(`cinecloud.mondomaine.fr`)"
    #   - "traefik.http.routers.cinecloud.entrypoints=websecure"
    #   - "traefik.http.routers.cinecloud.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.cinecloud.loadbalancer.server.port=3000"

volumes:
  cinecloud-data:
    name: nuvio-alldebrid-data
  cinecloud-warp:
    name: nuvio-alldebrid-warp

