services:
  # Service Cloudflare WARP : fournit une IP de sortie résidentielle/edge Cloudflare
  # permettant de contourner les blocages imposés par Alldebrid sur les IP Datacenter/VPS.
  warp:
    image: caomingjun/warp:latest
    container_name: nuvio-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - nuvio-warp:/var/lib/cloudflare-warp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -x http://127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      default:
        aliases:
          - warp
          - nuvio-warp

  nuvio:
    image: ghcr.io/d4rk56/nuvio-alldebrid:latest
    build: .
    container_name: nuvio-alldebrid
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WARP_PROXY=http://warp:1080
    depends_on:
      warp:
        condition: service_healthy
    volumes:
      - nuvio-data:/app/data

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nuvio-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nuvio:3000
    depends_on:
      nuvio:
        condition: service_healthy

volumes:
  nuvio-data:
    name: nuvio-alldebrid-data
  nuvio-warp:
    name: nuvio-alldebrid-warp
